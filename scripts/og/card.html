<!DOCTYPE html>
<!-- Source of og-pt.png and og-en.png (1200 x 630). Rendered by scripts/og/render.py; ?lang=en for English. -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght,SHRP@200..500,0..100&display=swap" rel="stylesheet">
<style>
@import url("../../tokens.css");
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); }
canvas { position: absolute; inset: 0 0 auto 0; width: 1200px; height: 330px; -webkit-mask-image: linear-gradient(to right, transparent, var(--color-ink) 10%, var(--color-ink) 90%, transparent), linear-gradient(to bottom, transparent, var(--color-ink) 35%); -webkit-mask-composite: source-in; }
.text { position: absolute; left: 80px; right: 80px; bottom: 72px; }
h1 { margin: 0; font-weight: 300; font-size: 104px; line-height: 1; letter-spacing: -0.035em; font-variation-settings: "SHRP" 100; }
p { margin: 24px 0 0; font-weight: 300; font-size: 34px; line-height: 1.3; color: var(--color-ink-2); }
.url { position: absolute; right: 80px; bottom: 80px; font-size: 24px; font-weight: 400; color: var(--color-accent-soft); }
.bar { width: 56px; height: 3px; background: var(--color-accent); margin-bottom: 28px; }
</style>
</head>
<body>
<canvas width="2400" height="660"></canvas>
<div class="text">
    <div class="bar"></div>
    <h1>Felipe Guedes</h1>
    <p id="line">Engenheiro de software sênior e tech lead.<br>Python, sistemas distribuídos e nuvem.</p>
</div>
<div class="url" id="url">guedesfelipe.github.io/pt-br</div>
<script>
if (new URLSearchParams(location.search).get('lang') === 'en') {
    document.documentElement.lang = 'en';
    document.getElementById('line').innerHTML = 'Senior software engineer and tech lead.<br>Python, distributed systems and cloud.';
    document.getElementById('url').textContent = 'guedesfelipe.github.io/en';
}
// the page's aurora, one still frame, seeded so every render is the same
let seed = 7;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
ctx.scale(2, 2);
const css = getComputedStyle(document.documentElement);
const colours = { green: css.getPropertyValue('--color-accent').trim(), violet: css.getPropertyValue('--color-aurora-violet').trim() };
const w = 1200, h = 330, TAU = Math.PI * 2, t = 5200;
const curtains = [
    { base: 0.82, amp: 0.10, freq: 0.9, phase: 0.10, speed: 0.00032, height: 0.66 },
    { base: 0.72, amp: 0.08, freq: 1.4, phase: 0.55, speed: -0.00024, height: 0.52 },
    { base: 0.90, amp: 0.06, freq: 2.1, phase: 0.30, speed: 0.00038, height: 0.72 },
    { base: 0.64, amp: 0.05, freq: 0.6, phase: 0.80, speed: 0.00020, height: 0.40 }
];
const groups = [
    { colour: 'green', alpha: 0.95, size: 1.8, top: 0.05 },
    { colour: 'green', alpha: 0.55, size: 1.5, top: 0.16 },
    { colour: 'green', alpha: 0.28, size: 1.3, top: 0.40 },
    { colour: 'violet', alpha: 0.38, size: 1.3, top: 0.62 },
    { colour: 'violet', alpha: 0.22, size: 1.2, top: 1.01 }
];
const pts = [];
for (let i = 0; i < 34000; i++) {
    const r = Math.pow(rand(), 2.4);
    pts.push({ c: i % 4, u: rand(), r, j: rand(), g: groups.findIndex(grp => r < grp.top) });
}
for (let g = 0; g < groups.length; g++) {
    ctx.fillStyle = colours[groups[g].colour];
    for (const pt of pts) {
        if (pt.g !== g) continue;
        const k = curtains[pt.c], u = pt.u, c = pt.c;
        ctx.globalAlpha = groups[g].alpha * (0.62 + 0.38 * Math.sin(t * 0.00045 + c * 1.9));
        const ray = 0.5 + 0.5 * Math.sin(TAU * (u * 9 + c * 0.37) + t * 0.0009) * Math.sin(TAU * (u * 2.7 + c * 0.11) - t * 0.0004);
        if (pt.j > 0.3 + 0.7 * ray) continue;
        const fold = Math.sin(TAU * (u * k.freq + k.phase) + t * k.speed) + 0.35 * Math.sin(TAU * (u * k.freq * 3.1) - t * k.speed * 1.7);
        const reach = k.height * (0.72 + 0.28 * Math.sin(TAU * (u * 1.6 + c * 0.2) + t * 0.0003));
        const x = u * w + 10 * Math.sin(TAU * (u * 1.3 + c * 0.25) + t * 0.00035);
        const y = h * (k.base + k.amp * fold) - pt.r * reach * h;
        ctx.fillRect(x, y, groups[g].size, groups[g].size);
    }
}
document.body.dataset.ready = '1';
</script>
</body>
</html>
